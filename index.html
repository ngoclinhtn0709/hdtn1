<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Kiểm Tra Trắc Nghiệm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .option-btn {
            transition: background-color 0.3s, border-color 0.3s, color 0.3s;
        }
        .option-btn.selected {
            background-color: #3b82f6; /* bg-blue-500 */
            border-color: #3b82f6; /* border-blue-500 */
            color: white;
        }
        .option-btn:hover:not(.selected) {
            background-color: #eff6ff; /* bg-blue-50 */
        }
        .correct {
            background-color: #22c55e !important; /* bg-green-500 */
            border-color: #22c55e !important;
            color: white !important;
        }
        .incorrect {
            background-color: #ef4444 !important; /* bg-red-500 */
            border-color: #ef4444 !important;
            color: white !important;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <div id="quiz-container" class="w-full max-w-2xl mx-auto bg-white rounded-2xl shadow-lg p-6 md:p-8">
        
        <!-- Màn hình bắt đầu -->
        <div id="start-screen">
            <h1 class="text-3xl font-bold text-center text-gray-800 mb-4">Bài Kiểm Tra Trắc Nghiệm</h1>
            <p class="text-center text-gray-600 mb-6">Bạn có 15 phút để hoàn thành 20 câu hỏi. Mỗi câu trả lời đúng được 0.5 điểm.</p>
            <div class="mb-4">
                <label for="student-name" class="block text-sm font-medium text-gray-700 mb-2">Vui lòng nhập họ và tên:</label>
                <input type="text" id="student-name" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500" placeholder="Nguyễn Văn A">
            </div>
            <button id="start-btn" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 transition duration-300">Bắt Đầu</button>
        </div>

        <!-- Màn hình bài kiểm tra -->
        <div id="quiz-screen" class="hidden">
            <!-- Header -->
            <div class="flex justify-between items-center mb-6 border-b pb-4">
                <h2 class="text-xl font-bold text-gray-800">Câu <span id="question-number">1</span>/20</h2>
                <div id="timer" class="text-2xl font-bold text-red-500 bg-red-100 px-4 py-2 rounded-lg">15:00</div>
            </div>

            <!-- Nội dung câu hỏi -->
            <div id="question-content" class="mb-6">
                 <div class="bg-gray-100 rounded-lg overflow-hidden border flex justify-center items-center min-h-[200px]">
                    <img id="question-image" src="" alt="Đang tải câu hỏi..." class="w-full h-auto object-contain max-h-80">
                </div>
            </div>

            <!-- Các đáp án -->
            <div id="options-container" class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <!-- Các nút đáp án sẽ được chèn vào đây bởi JS -->
            </div>

            <!-- Nút điều hướng -->
            <div class="flex justify-end">
                <button id="next-btn" class="bg-blue-600 text-white font-bold py-2 px-8 rounded-lg hover:bg-blue-700 transition duration-300">Câu Tiếp</button>
            </div>
        </div>

        <!-- Màn hình kết quả -->
        <div id="result-screen" class="hidden text-center">
            <h1 class="text-3xl font-bold text-gray-800 mb-4">Hoàn Thành!</h1>
            <p class="text-gray-600 mb-2">Họ và tên: <span id="result-name" class="font-semibold"></span></p>
            <p class="text-gray-600 mb-6">Điểm số của bạn là:</p>
            <p class="text-6xl font-bold text-blue-600 mb-8"><span id="score">0</span>/10</p>
            <div id="submission-status" class="text-sm text-gray-500">Đang gửi kết quả...</div>
            <button id="restart-btn" class="mt-4 bg-gray-600 text-white font-bold py-3 px-6 rounded-lg hover:bg-gray-700 transition duration-300">Làm Lại</button>
        </div>

    </div>

    <!-- Modal cho thông báo -->
    <div id="modal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-60 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-sm text-center">
            <p id="modal-message" class="text-lg text-gray-800 mb-6"></p>
            <button id="modal-close-btn" class="w-full bg-blue-600 text-white font-bold py-2 px-6 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">Đã hiểu</button>
        </div>
    </div>

    <script>
        // ===================================================================================
        // VUI LÒNG THAY THẾ URL BÊN DƯỚI BẰNG URL WEB APP CỦA GOOGLE APPS SCRIPT CỦA BẠN
        // ===================================================================================
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxuL2YkUZCqh2xHQ3IJ37lblB_zUetLOIpuith4JHdyu6pus4K0QDqoNhBdPkYmd5d1_g/exec'; 
        // ===================================================================================

        // Dữ liệu câu hỏi. Thay thế các URL ảnh và đáp án tại đây.
        const quizData = [
            {
                questionImage: "https://github.com/ngoclinhtn0709/hdtn1/blob/Anh/c01.png",
                options: ["Đáp án A", "Đáp án B", "Đáp án C", "Đáp án D"],
                answer: "Đáp án C"
            },
            {
                questionImage: "https://github.com/ngoclinhtn0709/hdtn1/blob/Anh/c02.png",
                options: ["Đáp án A", "Đáp án B", "Đáp án C", "Đáp án D"],
                answer: "Đáp án A"
            },
            {
                questionImage: "https://github.com/ngoclinhtn0709/hdtn1/blob/Anh/c03.png",
                options: ["Đáp án A", "Đáp án B", "Đáp án C", "Đáp án D"],
                answer: "Đáp án D"
            },
            {
                questionImage: "https://github.com/ngoclinhtn0709/hdtn1/blob/Anh/c04.png",
                options: ["Đáp án A", "Đáp án B", "Đáp án C", "Đáp án D"],
                answer: "Đáp án A"
            },
             {
                questionImage: "https://github.com/ngoclinhtn0709/hdtn1/blob/Anh/c05.png",
                options: ["Đáp án A", "Đáp án B", "Đáp án C", "Đáp án D"],
                answer: "Đáp án B"
            },
            {
                questionImage: "https://github.com/ngoclinhtn0709/hdtn1/blob/Anh/c06.png",
                options: ["Đáp án A", "Đáp án B", "Đáp án C", "Đáp án D"],
                answer: "Đáp án A"
            },
            {
                questionImage: "https://github.com/ngoclinhtn0709/hdtn1/blob/Anh/c07.png",
                options: ["Đáp án A", "Đáp án B", "Đáp án C", "Đáp án D"],
                answer: "Đáp án A"
            },
            {
                questionImage: "https://github.com/ngoclinhtn0709/hdtn1/blob/Anh/c08.png",
                options: ["Đáp án A", "Đáp án B", "Đáp án C", "Đáp án D"],
                answer: "Đáp án D"
            },
            {
                questionImage: "https://github.com/ngoclinhtn0709/hdtn1/blob/Anh/c09.png",
                options: ["Đáp án A", "Đáp án B", "Đáp án C", "Đáp án D"],
                answer: "Đáp án A"
            },
            {
                questionImage: "https://github.com/ngoclinhtn0709/hdtn1/blob/Anh/c10.png",
                options: ["Đáp án A", "Đáp án B", "Đáp án C", "Đáp án D"],
                answer: "Đáp án D"
            },
            {
                questionImage: "https://github.com/ngoclinhtn0709/hdtn1/blob/Anh/c11.png",
                options: ["Đáp án A", "Đáp án B", "Đáp án C", "Đáp án D"],
                answer: "Đáp án B"
            },
            {
                questionImage: "https://github.com/ngoclinhtn0709/hdtn1/blob/Anh/c12.png",
                options: ["Đáp án A", "Đáp án B", "Đáp án C", "Đáp án D"],
                answer: "Đáp án B"
            },
            {
                questionImage: "https://github.com/ngoclinhtn0709/hdtn1/blob/Anh/c13.png",
                options: ["Đáp án A", "Đáp án B", "Đáp án C", "Đáp án D"],
                answer: "Đáp án C"
            },
            {
                questionImage: "https://github.com/ngoclinhtn0709/hdtn1/blob/Anh/c14.png",
                options: ["Đáp án A", "Đáp án B", "Đáp án C", "Đáp án D"],
                answer: "Đáp án A"
            },
            {
                questionImage: "https://github.com/ngoclinhtn0709/hdtn1/blob/Anh/c15.png",
                options: ["Đáp án A", "Đáp án B", "Đáp án C", "Đáp án D"],
                answer: "Đáp án B"
            },
            {
                questionImage: "https://github.com/ngoclinhtn0709/hdtn1/blob/Anh/c16.png",
                options: ["Đáp án A", "Đáp án B", "Đáp án C", "Đáp án D"],
                answer: "Đáp án B"
            },
            {
                questionImage: "https://github.com/ngoclinhtn0709/hdtn1/blob/Anh/c17.png",
                options: ["Đáp án A", "Đáp án B", "Đáp án C", "Đáp án D"],
                answer: "Đáp án D"
            },
            {
                questionImage: "https://github.com/ngoclinhtn0709/hdtn1/blob/Anh/c18.png",
                options: ["Đáp án A", "Đáp án B", "Đáp án C", "Đáp án D"],
                answer: "Đáp án D"
            },
            {
                questionImage: "https://github.com/ngoclinhtn0709/hdtn1/blob/Anh/c19.png",
                options: ["Đáp án A", "Đáp án B", "Đáp án C", "Đáp án D"],
                answer: "Đáp án B"
            },
            {
                questionImage: "https://github.com/ngoclinhtn0709/hdtn1/blob/Anh/c20.png",
                options: ["Đáp án A", "Đáp án B", "Đáp án C", "Đáp án D"],
                answer: "Đáp án C"
            }
        ];

        const startScreen = document.getElementById('start-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        
        const studentNameInput = document.getElementById('student-name');
        const startBtn = document.getElementById('start-btn');
        const nextBtn = document.getElementById('next-btn');
        const restartBtn = document.getElementById('restart-btn');

        const questionNumberEl = document.getElementById('question-number');
        const questionImageEl = document.getElementById('question-image');
        const optionsContainer = document.getElementById('options-container');
        const timerEl = document.getElementById('timer');
        const scoreEl = document.getElementById('score');
        const resultNameEl = document.getElementById('result-name');
        const submissionStatusEl = document.getElementById('submission-status');

        const modal = document.getElementById('modal');
        const modalMessage = document.getElementById('modal-message');
        const modalCloseBtn = document.getElementById('modal-close-btn');

        let currentQuestionIndex = 0;
        let score = 0;
        let timer;
        let timeLeft = 600; // 15 minutes in seconds
        let userAnswers = [];
        let studentName = '';

        function showModal(message) {
            modalMessage.textContent = message;
            modal.classList.remove('hidden');
        }

        modalCloseBtn.addEventListener('click', () => {
            modal.classList.add('hidden');
        });

        function startQuiz() {
            studentName = studentNameInput.value.trim();
            if (studentName === '') {
                showModal('Vui lòng nhập họ và tên của bạn!');
                return;
            }

            startScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            
            currentQuestionIndex = 0;
            score = 0;
            userAnswers = Array(quizData.length).fill(null);
            
            displayQuestion();
            startTimer();
        }

        function displayQuestion() {
            const currentQuestion = quizData[currentQuestionIndex];
            questionNumberEl.textContent = currentQuestionIndex + 1;
            questionImageEl.src = currentQuestion.questionImage;
            optionsContainer.innerHTML = '';

            currentQuestion.options.forEach(option => {
                const button = document.createElement('button');
                button.textContent = option;
                button.classList.add('option-btn', 'w-full', 'text-left', 'p-4', 'border-2', 'rounded-lg', 'font-medium');
                
                if (userAnswers[currentQuestionIndex] === option) {
                    button.classList.add('selected');
                }

                button.addEventListener('click', () => selectAnswer(option, button));
                optionsContainer.appendChild(button);
            });
            
            if (currentQuestionIndex === quizData.length - 1) {
                nextBtn.textContent = 'Nộp Bài';
            } else {
                nextBtn.textContent = 'Câu Tiếp';
            }
        }

        function selectAnswer(option, selectedButton) {
            userAnswers[currentQuestionIndex] = option;
            document.querySelectorAll('.option-btn').forEach(btn => btn.classList.remove('selected'));
            selectedButton.classList.add('selected');
        }
        
        function nextQuestion() {
            if (userAnswers[currentQuestionIndex] === null) {
                showModal('Vui lòng chọn một đáp án!');
                return;
            }

            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                displayQuestion();
            } else {
                endQuiz();
            }
        }
        
        function endQuiz() {
            clearInterval(timer);
            calculateScore();
            quizScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            
            scoreEl.textContent = score*0.5;
            resultNameEl.textContent = studentName;

            submitScore();
        }

        function calculateScore() {
            score = 0;
            userAnswers.forEach((answer, index) => {
                if (answer === quizData[index].answer) {
                    score++;
                }
            });
        }

        function startTimer() {
            timeLeft = 600;
            timerEl.textContent = '15:00';
            timer = setInterval(() => {
                timeLeft--;
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerEl.textContent = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    endQuiz();
                }
            }, 1000);
        }

        function submitScore() 
        {
           if (APPS_SCRIPT_URL === 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE') 
           {
               submissionStatusEl.textContent = 'Lỗi: Vui lòng cấu hình URL của Google Apps Script.';
               submissionStatusEl.classList.add('text-red-500');
               return;
           }
            
            const data = {
                name: studentName,
                score: score*0.5,
                total: quizData.length
            };

            fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors', // Important for simple POST requests to Apps Script
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data)
            })
            .then(() => {
                submissionStatusEl.textContent = 'Kết quả đã được gửi thành công!';
                submissionStatusEl.classList.remove('text-gray-500', 'text-red-500');
                submissionStatusEl.classList.add('text-green-600');
            })
            .catch(error => {
                console.error('Error:', error);
                submissionStatusEl.textContent = 'Gửi kết quả thất bại. Vui lòng kiểm tra lại kết nối.';
                submissionStatusEl.classList.remove('text-gray-500', 'text-green-600');
                submissionStatusEl.classList.add('text-red-500');
            });
        }

        function restartQuiz() {
            resultScreen.classList.add('hidden');
            startScreen.classList.remove('hidden');
            studentNameInput.value = '';
        }

        startBtn.addEventListener('click', startQuiz);
        nextBtn.addEventListener('click', nextQuestion);
        restartBtn.addEventListener('click', restartQuiz);
    </script>

</body>
</html>
